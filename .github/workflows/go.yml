name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: sprites/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Build
        working-directory: sprites
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=build-${{ github.run_number }}" -o ../bin/pseudo3d-sprites .
      - run: strip bin/pseudo3d-sprites
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: bin/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: sprites/go.sum
      - shell: pwsh
        working-directory: sprites
        run: |
          $env:CGO_ENABLED = "1"; $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -ldflags "-s -w -H=windowsgui -X main.version=build-${{ github.run_number }}" -o ../bin/pseudo3d-sprites.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: bin/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: sprites/go.sum
      - name: Build
        working-directory: sprites
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=build-${{ github.run_number }}" -o ../bin/pseudo3d-sprites-amd64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=build-${{ github.run_number }}" -o ../bin/pseudo3d-sprites-arm64 .
      - run: strip bin/pseudo3d-sprites-amd64 bin/pseudo3d-sprites-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: macos-binary
          path: bin/*

  create-release:
    runs-on: ubuntu-slim
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Restore executables permissions
        run: |
          chmod +x artifacts/pseudo3d*

      - name: Prepare release archives
        run: |
          mkdir -p release-linux release-windows release-macos-amd64 release-macos-arm64
          for folder in release-linux release-windows release-macos-amd64 release-macos-arm64; do
            mkdir -p $folder/archive
            mkdir -p $folder/process
          done

          cp artifacts/pseudo3d-sprites release-linux/pseudo3d-sprites
          cp artifacts/pseudo3d-sprites.exe release-windows/pseudo3d-sprites.exe
          cp artifacts/pseudo3d-sprites-amd64 release-macos-amd64/pseudo3d-sprites
          cp artifacts/pseudo3d-sprites-arm64 release-macos-arm64/pseudo3d-sprites

          cp README.md release-linux/
          cp README.md release-windows/
          cp README.md release-macos-amd64/
          cp README.md release-macos-arm64/

      - name: Generate RBXLX from Luau
        run: |
          BUILD_VERSION="build-${{ github.run_number }}"
          LUAU_CONTENT=$(cat maker/main.luau)

          awk -v r="$LUAU_CONTENT" -v v="$BUILD_VERSION" '
          {
            gsub(/\$\(buildver\)/, v)
            gsub(/\$\(cat main\.luau\)/, r)
            print
          }
          ' maker/template.xml > outtahere.rbxlx

      - name: Convert RBXLX to RBXL
        uses: t7ru/rbx-convert-action@v0.2.0
        with:
          input: outtahere.rbxlx
          output: pseudo3d-maker.rbxl

      - name: Package archives
        run: |
          for folder in release-linux release-windows release-macos-amd64 release-macos-arm64; do
            cp pseudo3d-maker.rbxl "$folder/pseudo3d-maker.rbxl"
          done

          cd release-linux
          tar -czf ../pseudo3d-linux-amd64.tar.gz *
          cd ..

          cd release-windows
          zip -r ../pseudo3d-windows-amd64.zip *
          cd ..

          cd release-macos-amd64
          zip -r ../pseudo3d-macos-amd64.zip *
          cd ..

          cd release-macos-arm64
          zip -r ../pseudo3d-macos-arm64.zip *
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            pseudo3d-linux-amd64.tar.gz
            pseudo3d-windows-amd64.zip
            pseudo3d-macos-amd64.zip
            pseudo3d-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous tag
        id: prev_tag
        run: |
          git fetch --tags --force
          PREV=$(git tag --list 'build-*' --sort=-version:refname \
            | grep -v "^build-${{ github.run_number }}$" \
            | head -n 1)
          echo "prev=${PREV}" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.prev_tag.outputs.prev }}
          toTag: build-${{ github.run_number }}
          mode: "COMMIT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release
        run: gh release edit "build-${{ github.run_number }}" --notes "${{ steps.changelog.outputs.changelog }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

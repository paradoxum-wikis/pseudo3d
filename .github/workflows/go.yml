name: Go
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        run: |
          GOOS=windows GOARCH=amd64 go build -v -o bin/pseudo3d-sprites-windows-amd64.exe ./...
          GOOS=darwin  GOARCH=amd64 go build -v -o bin/pseudo3d-sprites-macos-amd64 ./...
          GOOS=darwin  GOARCH=arm64 go build -v -o bin/pseudo3d-sprites-macos-arm64 ./...
          GOOS=linux   GOARCH=amd64 go build -v -o bin/pseudo3d-sprites-linux-amd64 ./...

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: build-${{ github.run_number }}
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites ./...
      - run: strip bin/pseudo3d-sprites
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: bin/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            C:/Users/runneradmin/go/pkg/mod
            C:/Users/runneradmin/AppData/Local/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"; $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -ldflags "-s -w" -o bin/pseudo3d-sprites.exe ./...
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: bin/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites-amd64 ./...
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites-arm64 ./...
          strip bin/pseudo3d-sprites-amd64 bin/pseudo3d-sprites-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: macos-binary
          path: bin/*

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release archives
        run: |
          mkdir -p release-linux release-windows release-macos-amd64 release-macos-arm64
          for folder in release-linux release-windows release-macos-amd64 release-macos-arm64; do
            mkdir -p $folder/archive
            mkdir -p $folder/process
          done

          cp artifacts/pseudo3d-sprites release-linux/pseudo3d-sprites
          cp artifacts/pseudo3d-sprites.exe release-windows/pseudo3d-sprites.exe
          cp artifacts/pseudo3d-sprites-amd64 release-macos-amd64/pseudo3d-sprites
          cp artifacts/pseudo3d-sprites-arm64 release-macos-arm64/pseudo3d-sprites

          cp README.md release-linux/
          cp README.md release-windows/
          cp README.md release-macos-amd64/
          cp README.md release-macos-arm64/

      - name: Generate RBXMX from Luau
        run: |
          for folder in release-linux release-windows release-macos-amd64 release-macos-arm64; do
            cat > "$folder/pseudo3d-create.rbxmx" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">
            <External>null</External>
            <External>nil</External>
            <Item class="LocalScript" referent="RBX0">
              <Properties>
                <string name="Name">pseudo3d-create</string>
                <ProtectedString name="Source"><![CDATA[$(cat main.luau)]]></ProtectedString>
              </Properties>
            </Item>
          </roblox>
          EOF
          done

      - name: Package archives
        run: |
          cd release-linux
          tar -cJf ../pseudo3d-sprites-linux-amd64.tar.xz *
          cd ..

          cd release-windows
          zip -r ../pseudo3d-sprites-windows-amd64.zip *
          cd ..

          cd release-macos-amd64
          zip -r ../pseudo3d-sprites-macos-amd64.zip *
          cd ..

          cd release-macos-arm64
          zip -r ../pseudo3d-sprites-macos-arm64.zip *
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            pseudo3d-sprites-linux-amd64.tar.xz
            pseudo3d-sprites-windows-amd64.zip
            pseudo3d-sprites-macos-amd64.zip
            pseudo3d-sprites-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

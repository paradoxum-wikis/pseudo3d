name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites-linux-amd64 ./...
      - run: strip bin/pseudo3d-sprites-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: bin/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            C:/Users/runneradmin/go/pkg/mod
            C:/Users/runneradmin/AppData/Local/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"; $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -ldflags "-s -w" -o bin/pseudo3d-sprites-windows-amd64.exe ./...

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: bin/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites-macos-amd64 ./...
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o bin/pseudo3d-sprites-macos-arm64 ./...
          strip bin/pseudo3d-sprites-macos-amd64 bin/pseudo3d-sprites-macos-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: macos-binary
          path: bin/*

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

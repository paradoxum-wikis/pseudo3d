<!doctype html>
<html>
	<head>
		<title>Safe Zone Selector</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				text-align: center;
				background: oklch(20% 0 0);
				color: oklch(100% 0 0);
				margin: 0;
				padding: 1.25em;
			}
			h2 {
				margin: 0;
			}
			p {
				margin-top: 0.25em;
			}
			#wrapper {
				display: inline-block;
				position: relative;
				cursor: crosshair;
				user-select: none;
			}
			img {
				max-width: 90vw;
				max-height: 80vh;
				display: block;
			}
			#selection {
				position: absolute;
				border: 0.125em solid oklch(60% 5 120);
				background: oklch(60% 5 120 / 0.2);
				display: none;
				pointer-events: none;
			}
			.controls {
				margin-top: 1.25em;
			}
			button {
				padding: 0.625em 1.25em;
				font-size: 1em;
				cursor: pointer;
				background: oklch(50% 0 130);
				color: oklch(100% 0 0);
				border: none;
				border-radius: 0.25em;
			}
			button:hover {
				background: oklch(45% 0 130);
			}
			#status {
				margin-top: 0.625em;
				color: oklch(60% 5 120);
			}
			#frameSlider {
				width: 60%;
				margin-top: 0.75em;
			}
			#frameLabel {
				margin-left: 0.5em;
				font-size: 0.9em;
				color: oklch(60% 0 0);
			}
			#toggleLock {
				font-size: 0.85em;
				padding: 0.3em 0.8em;
				margin-top: 0.75em;
			}
		</style>
	</head>
	<body>
		<h2>Draw Safe Zone</h2>
		<p>
			Click and drag to define the crop area. This will be used for all
			frames.<br /><button id="toggleLock">Square Ratio</button>
		</p>

		<div id="wrapper">
			<img id="refImage" src="/image/0" draggable="false" />
			<div id="selection"></div>
		</div>
		<div class="controls">
			<input type="range" id="frameSlider" min="0" value="0" />
			<span id="frameLabel">Frame 1</span>
		</div>

		<div class="controls">
			<button id="saveBtn">Save & Process!</button>
			<div id="status">No selection...</div>
		</div>

		<script>
			const wrapper = document.getElementById("wrapper");
			const img = document.getElementById("refImage");
			const selection = document.getElementById("selection");
			const status = document.getElementById("status");
			const saveBtn = document.getElementById("saveBtn");

			let isDragging = false;
			let lockAspect = true;

			const toggleLock = document.getElementById("toggleLock");
			toggleLock.addEventListener("click", () => {
				lockAspect = !lockAspect;
				toggleLock.textContent = lockAspect
					? "Square Ratio"
					: "Freeform";
			});
			let startX, startY;
			let box = { x: 0, y: 0, w: 0, h: 0 };

			wrapper.addEventListener("mousedown", (e) => {
				isDragging = true;
				const rect = wrapper.getBoundingClientRect();
				startX = e.clientX - rect.left;
				startY = e.clientY - rect.top;
				selection.style.left = startX + "px";
				selection.style.top = startY + "px";
				selection.style.width = "0px";
				selection.style.height = "0px";
				selection.style.display = "block";
			});

			window.addEventListener("mousemove", (e) => {
				if (!isDragging) return;
				const rect = wrapper.getBoundingClientRect();
				const currentX = Math.max(
					0,
					Math.min(e.clientX - rect.left, rect.width),
				);
				const currentY = Math.max(
					0,
					Math.min(e.clientY - rect.top, rect.height),
				);

				const rawW = currentX - startX;
				const rawH = currentY - startY;

				if (lockAspect) {
					const side = Math.min(Math.abs(rawW), Math.abs(rawH));
					const signX = rawW >= 0 ? 1 : -1;
					const signY = rawH >= 0 ? 1 : -1;
					box.w = side;
					box.h = side;
					box.x = signX >= 0 ? startX : startX - side;
					box.y = signY >= 0 ? startY : startY - side;
				} else {
					box.w = Math.abs(rawW);
					box.h = Math.abs(rawH);
					box.x = rawW >= 0 ? startX : startX + rawW;
					box.y = rawH >= 0 ? startY : startY + rawH;
				}

				selection.style.left = box.x + "px";
				selection.style.top = box.y + "px";
				selection.style.width = box.w + "px";
				selection.style.height = box.h + "px";
			});

			window.addEventListener("mouseup", () => {
				if (isDragging) {
					isDragging = false;
					const scaleX = img.naturalWidth / img.width;
					const scaleY = img.naturalHeight / img.height;

					const minX = Math.round(box.x * scaleX);
					const minY = Math.round(box.y * scaleY);
					const maxX = Math.round((box.x + box.w) * scaleX);
					const maxY = Math.round((box.y + box.h) * scaleY);

					status.innerText =
						"Selected: " +
						(maxX - minX) +
						"x" +
						(maxY - minY) +
						" at (" +
						minX +
						"," +
						minY +
						")";

					window.currentSelection = { minX, minY, maxX, maxY };
				}
			});

			const slider = document.getElementById("frameSlider");
			const frameLabel = document.getElementById("frameLabel");

			fetch("/count")
				.then((r) => r.json())
				.then((n) => {
					slider.max = n - 1;
					frameLabel.innerText = "Frame 1 / " + n;
				});

			slider.addEventListener("input", () => {
				img.src = "/image/" + slider.value;
				frameLabel.innerText =
					"Frame " +
					(parseInt(slider.value) + 1) +
					" / " +
					(parseInt(slider.max) + 1);
			});

			document.addEventListener("keydown", (e) => {
				if (!window.currentSelection) return;
				const arrows = {
					ArrowLeft: [-1, 0],
					ArrowRight: [1, 0],
					ArrowUp: [0, -1],
					ArrowDown: [0, 1],
				};
				const delta = arrows[e.key];
				if (!delta) return;
				e.preventDefault();

				const step = e.shiftKey ? 10 : 1;
				const sel = window.currentSelection;
				sel.minX += delta[0] * step;
				sel.maxX += delta[0] * step;
				sel.minY += delta[1] * step;
				sel.maxY += delta[1] * step;

				const scaleX = img.naturalWidth / img.width;
				const scaleY = img.naturalHeight / img.height;
				box.x = sel.minX / scaleX;
				box.y = sel.minY / scaleY;
				box.w = (sel.maxX - sel.minX) / scaleX;
				box.h = (sel.maxY - sel.minY) / scaleY;
				selection.style.left = box.x + "px";
				selection.style.top = box.y + "px";
				selection.style.width = box.w + "px";
				selection.style.height = box.h + "px";

				status.innerText =
					"Selected: " +
					(sel.maxX - sel.minX) +
					"x" +
					(sel.maxY - sel.minY) +
					" at (" +
					sel.minX +
					"," +
					sel.minY +
					")";
			});

			saveBtn.addEventListener("click", () => {
				if (
					!window.currentSelection ||
					window.currentSelection.maxX ===
						window.currentSelection.minX
				) {
					alert("Please draw a selection first!");
					return;
				}

				saveBtn.innerText = "Done.";
				saveBtn.disabled = true;

				fetch("/save", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify(window.currentSelection),
				})
					.then(() => {
						status.innerText =
							"Processing has started, go check your terminal.";
					})
					.catch((err) => alert("Error: " + err));
			});
		</script>
	</body>
</html>
